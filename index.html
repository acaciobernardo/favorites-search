<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesquisa rápida</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1a73e8;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --surface: #fff;
      --background: #f8fafd;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font: 14px Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 28px;
      color: var(--muted);
    }
    header button {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
    }
    header button:hover { color: var(--text); }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 58px auto 56px;
    }
    .brand {
      margin: 0 0 28px;
      color: var(--text);
      font-size: clamp(48px, 10vw, 78px);
      font-weight: 500;
      letter-spacing: -5px;
      text-align: center;
    }
    .brand span:nth-child(1), .brand span:nth-child(4) { color: #4285f4; }
    .brand span:nth-child(2) { color: #ea4335; }
    .brand span:nth-child(3) { color: #fbbc05; }
    .brand span:nth-child(5) { color: #34a853; }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(650px, 100%);
      height: 48px;
      margin: auto;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 1px 5px rgb(32 33 36 / 10%);
    }
    .search-wrap:focus-within {
      border-color: transparent;
      box-shadow: 0 1px 6px rgb(32 33 36 / 28%);
    }
    .search-icon { color: var(--muted); font-size: 20px; }
    #search {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
      font: 17px Arial, sans-serif;
    }
    .clear {
      display: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 20px;
    }
    .clear.visible { display: block; }
    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(60px, 1fr));
      gap: 8px 10px;
      width: min(920px, 100%);
      margin: 20px auto 0;
    }
    .shortcut {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 6px 3px;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
    }
    .shortcut:hover { background: #eef3f8; }
    .shortcut-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }
    .shortcut-icon img { width: 100%; height: 100%; object-fit: cover; }
    .shortcut-title {
      overflow: hidden;
      width: 100%;
      font-size: 12px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shortcut-add { border: 0; background: transparent; cursor: pointer; font: inherit; }
    .shortcut-add .shortcut-icon { font-size: 24px; font-weight: normal; }
    .shortcut-grid:empty { display: none; }
    .shortcut-menu {
      position: fixed;
      z-index: 3;
      min-width: 120px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 16px rgb(32 33 36 / 20%);
    }
    .shortcut-menu.hidden { display: none; }
    .shortcut-menu button {
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .shortcut-menu button:hover { background: #f1f3f4; }
    .shortcut-menu .remove { color: #b3261e; }
    @media (max-width: 760px) {
      .shortcut-grid { grid-template-columns: repeat(5, minmax(60px, 1fr)); }
    }
    .modal-backdrop {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgb(32 33 36 / 35%);
    }
    .modal-backdrop.hidden { display: none; }
    .modal {
      width: min(420px, 100%);
      padding: 24px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 8px 30px rgb(32 33 36 / 25%);
    }
    .modal h2 { margin: 0 0 18px; font-size: 20px; font-weight: 500; }
    .modal label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 13px; }
    .modal input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: 0;
      font: inherit;
    }
    .modal input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgb(26 115 232 / 15%); }
    .modal-error { min-height: 18px; margin: 8px 0 0; color: #b3261e; font-size: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .modal-actions button {
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }
    .modal-actions .confirm { border-color: var(--blue); background: var(--blue); color: white; }
    .google-search-button {
      display: block;
      margin: 16px auto 0;
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #f1f3f4;
      color: #3c4043;
      cursor: pointer;
      font: inherit;
    }
    .google-search-button:hover {
      border-color: var(--line);
      box-shadow: 0 1px 1px rgb(0 0 0 / 10%);
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 26px 0 44px;
    }
    .actions button {
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #f1f3f4;
      color: #3c4043;
      cursor: pointer;
      font: inherit;
    }
    .actions button:hover {
      border-color: var(--line);
      box-shadow: 0 1px 1px rgb(0 0 0 / 10%);
    }
    .data-source {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    #status {
      min-height: 20px;
      margin: 22px 0 8px;
      color: var(--muted);
      text-align: center;
    }
    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .panel {
      min-height: 100px;
      padding: 20px;
      border: 1px solid #e6e8eb;
      border-radius: 12px;
      background: var(--surface);
    }
    .panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 500;
    }
    .count { color: var(--muted); font-size: 12px; font-weight: normal; }
    .result {
      display: block;
      padding: 12px 4px;
      border-top: 1px solid #f0f0f0;
      color: inherit;
      text-decoration: none;
    }
    .result:hover { background: #f8fafd; }
    .result-title {
      overflow: hidden;
      color: #1a0dab;
      font-size: 15px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-url {
      overflow: hidden;
      margin-top: 4px;
      color: #188038;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-meta { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); line-height: 1.5; }
    .hidden { display: none; }
    @media (max-width: 680px) {
      main { margin-top: 62px; }
      .results { grid-template-columns: 1fr; }
      header { padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <button id="about" type="button">Como funciona?</button>
  </header>

  <main>
    <h1 class="brand" aria-label="Mapfre">
      <span>M</span><span>a</span><span>p</span><span>f</span><span>r</span><span>e</span>
    </h1>
    <form id="search-form" role="search">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" autocomplete="off" placeholder="Pesquisar nos favoritos e histórico" aria-label="Pesquisar">
        <button id="clear" class="clear" type="button" aria-label="Limpar pesquisa">×</button>
      </div>
      <button id="google-search" class="google-search-button" type="button">Pesquisar no Google</button>
    </form>

    <nav id="shortcut-grid" class="shortcut-grid" aria-label="Atalhos dos favoritos"></nav>
    <p class="data-source">A consultar diretamente os favoritos e o histórico deste Edge.</p>

    <div id="status" aria-live="polite"></div>
    <section id="results" class="results hidden" aria-label="Resultados">
      <div class="panel">
        <h2>Favoritos <span id="favorites-count" class="count"></span></h2>
        <div id="favorites-results"></div>
      </div>
      <div class="panel">
        <h2>Histórico recente <span id="history-count" class="count"></span></h2>
        <div id="history-results"></div>
      </div>
    </section>
  </main>

  <div id="shortcut-menu" class="shortcut-menu hidden">
    <button id="rename-shortcut" type="button">✎&nbsp; Mudar o nome</button>
    <button id="remove-shortcut" class="remove" type="button">♧&nbsp; Remover</button>
  </div>
  <div id="rename-modal" class="modal-backdrop hidden" role="presentation">
    <form id="rename-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="rename-modal-title">
      <h2 id="rename-modal-title">Mudar o nome</h2>
      <label for="shortcut-title-input">Nome do atalho</label>
      <input id="shortcut-title-input" type="text" autocomplete="off" required>
      <p id="rename-error" class="modal-error" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="rename-cancel" type="button">Cancelar</button>
        <button class="confirm" type="submit">Guardar</button>
      </div>
    </form>
  </div>
  <div id="shortcut-modal" class="modal-backdrop hidden" role="presentation">
    <form id="shortcut-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="shortcut-modal-title">
      <h2 id="shortcut-modal-title">Adicionar atalho</h2>
      <label for="shortcut-url">Link do atalho</label>
      <input id="shortcut-url" type="url" inputmode="url" placeholder="https://exemplo.pt" autocomplete="off" required>
      <p id="shortcut-error" class="modal-error" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="shortcut-cancel" type="button">Cancelar</button>
        <button class="confirm" type="submit">Confirmar</button>
      </div>
    </form>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
