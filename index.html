<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesquisa rápida</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1a73e8;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --surface: #fff;
      --background: #f8fafd;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font: 14px Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 28px;
      color: var(--muted);
    }
    header button {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
    }
    header button:hover { color: var(--text); }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 58px auto 56px;
    }
    .brand {
      margin: 0 0 28px;
      line-height: 0;
      text-align: center;
    }
    .brand svg { width: min(272px, 100%); height: auto; }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(650px, 100%);
      height: 48px;
      margin: auto;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 1px 5px rgb(32 33 36 / 10%);
    }
    .search-wrap:focus-within {
      border-color: transparent;
      box-shadow: 0 1px 6px rgb(32 33 36 / 28%);
    }
    .search-icon { color: var(--muted); font-size: 20px; }
    #search {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
      font: 17px Arial, sans-serif;
    }
    .add-favorite, .result-add {
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--blue);
      cursor: pointer;
      font: 18px/1 Arial, sans-serif;
    }
    .add-favorite { flex: none; width: 30px; height: 30px; }
    .add-favorite:hover, .result-add:hover { background: #e8f0fe; }
    .result { position: relative; }
    .result-add { position: absolute; top: 10px; right: 6px; width: 26px; height: 26px; }
    .result-add:disabled { color: var(--muted); cursor: default; }
    .result.has-add { padding-right: 40px; }
    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(60px, 1fr));
      gap: 8px 10px;
      width: min(920px, 100%);
      margin: 20px auto 0;
    }
    .shortcut {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 6px 3px;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
    }
    .shortcut:hover { background: #eef3f8; }
    .shortcut-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }
    .shortcut-icon img { width: 100%; height: 100%; object-fit: cover; }
    .shortcut-title {
      overflow: hidden;
      width: 100%;
      font-size: 12px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shortcut-add { border: 0; background: transparent; cursor: pointer; font: inherit; }
    .shortcut-add .shortcut-icon { font-size: 24px; font-weight: normal; }
    .shortcut-grid:empty { display: none; }
    .shortcut-menu {
      position: fixed;
      z-index: 3;
      min-width: 120px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 16px rgb(32 33 36 / 20%);
    }
    .shortcut-menu.hidden { display: none; }
    .shortcut-menu button {
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .shortcut-menu button:hover { background: #f1f3f4; }
    .shortcut-menu .remove { color: #b3261e; }
    @media (max-width: 760px) {
      .shortcut-grid { grid-template-columns: repeat(5, minmax(60px, 1fr)); }
    }
    .modal-backdrop {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgb(32 33 36 / 35%);
    }
    .modal-backdrop.hidden { display: none; }
    .modal {
      width: min(420px, 100%);
      padding: 24px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 8px 30px rgb(32 33 36 / 25%);
    }
    .modal h2 { margin: 0 0 18px; font-size: 20px; font-weight: 500; }
    .modal label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 13px; }
    .modal input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: 0;
      font: inherit;
    }
    .modal input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgb(26 115 232 / 15%); }
    .modal-error { min-height: 18px; margin: 8px 0 0; color: #b3261e; font-size: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .modal-actions button {
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }
    .modal-actions .confirm { border-color: var(--blue); background: var(--blue); color: white; }
    .google-search-button {
      display: block;
      margin: 16px auto 0;
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #f1f3f4;
      color: #3c4043;
      cursor: pointer;
      font: inherit;
    }
    .google-search-button:hover {
      border-color: var(--line);
      box-shadow: 0 1px 1px rgb(0 0 0 / 10%);
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 26px 0 44px;
    }
    .actions button {
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #f1f3f4;
      color: #3c4043;
      cursor: pointer;
      font: inherit;
    }
    .actions button:hover {
      border-color: var(--line);
      box-shadow: 0 1px 1px rgb(0 0 0 / 10%);
    }
    .data-source {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    #status {
      min-height: 20px;
      margin: 22px 0 8px;
      color: var(--muted);
      text-align: center;
    }
    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .panel {
      min-height: 100px;
      padding: 20px;
      border: 1px solid #e6e8eb;
      border-radius: 12px;
      background: var(--surface);
    }
    .panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 500;
    }
    .count { color: var(--muted); font-size: 12px; font-weight: normal; }
    .domain-box {
      margin-bottom: 12px;
      padding: 4px 12px 2px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .domain-title {
      margin: 8px 0 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    .domain-box > .result:first-of-type { border-top: 0; }
    .domain-preview {
      height: 30px;
      overflow: hidden;
      padding: 8px 4px 0;
      border-top: 1px solid #f0f0f0;
      mask-image: linear-gradient(to bottom, #000, transparent);
      pointer-events: none;
    }
    .domain-preview[hidden] { display: none; }
    .domain-toggle {
      display: grid;
      width: 28px;
      height: 28px;
      margin: 0 auto 4px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .domain-toggle:hover { background: #f1f3f4; }
    .domain-toggle::before {
      width: 7px;
      height: 7px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      content: "";
      transform: translateY(-2px) rotate(45deg);
    }
    .domain-toggle[aria-expanded="true"]::before { transform: translateY(2px) rotate(225deg); }
    .result-description {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 4px;
      color: #3c4043;
      font-size: 12px;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }
    .result {
      display: block;
      padding: 12px 4px;
      border-top: 1px solid #f0f0f0;
      color: inherit;
      text-decoration: none;
    }
    .result:hover { background: #f8fafd; }
    .result-title {
      overflow: hidden;
      color: #1a0dab;
      font-size: 15px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-url {
      overflow: hidden;
      margin-top: 4px;
      color: #188038;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-meta { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); line-height: 1.5; }
    .hidden { display: none; }
    @media (max-width: 680px) {
      main { margin-top: 62px; }
      .results { grid-template-columns: 1fr; }
      header { padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <button id="about" type="button">Como funciona?</button>
  </header>

  <main>
    <h1 class="brand" aria-label="Google">
      <svg xmlns="http://www.w3.org/2000/svg" width="74" height="24" viewBox="0 0 74 24" aria-hidden="true">
        <path fill="#4285F4" d="M9.24 8.19v2.46h5.88c-.18 1.38-.64 2.39-1.34 3.1-.86.86-2.2 1.8-4.54 1.8-3.62 0-6.45-2.92-6.45-6.54s2.83-6.54 6.45-6.54c1.95 0 3.38.77 4.43 1.76L15.4 2.5C13.94 1.08 11.98 0 9.24 0 4.28 0 .11 4.04.11 9s4.17 9 9.13 9c2.68 0 4.7-.88 6.28-2.52 1.62-1.62 2.13-3.91 2.13-5.75 0-.57-.04-1.1-.13-1.54H9.24z"/>
        <path fill="#EA4335" d="M25 6.19c-3.21 0-5.83 2.44-5.83 5.81 0 3.34 2.62 5.81 5.83 5.81s5.83-2.46 5.83-5.81c0-3.37-2.62-5.81-5.83-5.81zm0 9.33c-1.76 0-3.28-1.45-3.28-3.52 0-2.09 1.52-3.52 3.28-3.52s3.28 1.43 3.28 3.52c0 2.07-1.52 3.52-3.28 3.52z"/>
        <path fill="#4285F4" d="M53.58 7.49h-.09c-.57-.68-1.67-1.3-3.06-1.3C47.53 6.19 45 8.72 45 12c0 3.26 2.53 5.81 5.43 5.81 1.39 0 2.49-.62 3.06-1.32h.09v.81c0 2.22-1.19 3.41-3.1 3.41-1.56 0-2.53-1.12-2.93-2.07l-2.22.92c.64 1.54 2.33 3.43 5.15 3.43 2.99 0 5.52-1.76 5.52-6.05V6.49h-2.42v1zm-2.93 8.03c-1.76 0-3.1-1.5-3.1-3.52 0-2.05 1.34-3.52 3.1-3.52 1.74 0 3.1 1.5 3.1 3.54.01 2.03-1.36 3.5-3.1 3.5z"/>
        <path fill="#FBBC05" d="M38 6.19c-3.21 0-5.83 2.44-5.83 5.81 0 3.34 2.62 5.81 5.83 5.81s5.83-2.46 5.83-5.81c0-3.37-2.62-5.81-5.83-5.81zm0 9.33c-1.76 0-3.28-1.45-3.28-3.52 0-2.09 1.52-3.52 3.28-3.52s3.28 1.43 3.28 3.52c0 2.07-1.52 3.52-3.28 3.52z"/>
        <path fill="#34A853" d="M58 .24h2.51v17.57H58z"/>
        <path fill="#EA4335" d="M68.26 15.52c-1.3 0-2.22-.59-2.82-1.76l7.77-3.21-.26-.66c-.48-1.3-1.96-3.7-4.97-3.7-2.99 0-5.48 2.35-5.48 5.81 0 3.26 2.46 5.81 5.76 5.81 2.66 0 4.2-1.63 4.84-2.57l-1.98-1.32c-.66.96-1.56 1.6-2.86 1.6zm-.18-7.15c1.03 0 1.91.53 2.2 1.28l-5.25 2.17c0-2.44 1.73-3.45 3.05-3.45z"/>
      </svg>
    </h1>
    <form id="search-form" role="search">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" autocomplete="off" placeholder="Pesquisar nos favoritos e histórico" aria-label="Pesquisar">
        <button id="add-favorite" class="add-favorite" type="button" title="Adicionar favorito" aria-label="Adicionar favorito">+</button>
      </div>
      <button id="google-search" class="google-search-button" type="button">Pesquisar no Google</button>
    </form>

    <nav id="shortcut-grid" class="shortcut-grid" aria-label="Atalhos dos favoritos"></nav>
    <p class="data-source">A consultar diretamente os favoritos e o histórico deste Edge.</p>

    <div id="status" aria-live="polite"></div>
    <section id="results" class="results hidden" aria-label="Resultados">
      <div class="panel">
        <h2>Favoritos <span id="favorites-count" class="count"></span></h2>
        <div id="favorites-results"></div>
      </div>
      <div class="panel">
        <h2>Histórico recente <span id="history-count" class="count"></span></h2>
        <div id="history-results"></div>
      </div>
    </section>
  </main>

  <div id="shortcut-menu" class="shortcut-menu hidden">
    <button id="rename-shortcut" type="button">✎&nbsp; Mudar o nome</button>
    <button id="remove-shortcut" class="remove" type="button">♧&nbsp; Remover</button>
  </div>
  <div id="rename-modal" class="modal-backdrop hidden" role="presentation">
    <form id="rename-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="rename-modal-title">
      <h2 id="rename-modal-title">Mudar o nome</h2>
      <label for="shortcut-title-input">Nome do atalho</label>
      <input id="shortcut-title-input" type="text" autocomplete="off" required>
      <p id="rename-error" class="modal-error" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="rename-cancel" type="button">Cancelar</button>
        <button class="confirm" type="submit">Guardar</button>
      </div>
    </form>
  </div>
  <div id="favorite-modal" class="modal-backdrop hidden" role="presentation">
    <form id="favorite-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="favorite-modal-title">
      <h2 id="favorite-modal-title">Adicionar favorito</h2>
      <label for="favorite-url">Link da página</label>
      <input id="favorite-url" type="url" inputmode="url" placeholder="https://exemplo.pt" autocomplete="off" required>
      <p id="favorite-error" class="modal-error" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="favorite-cancel" type="button">Cancelar</button>
        <button class="confirm" type="submit">Adicionar</button>
      </div>
    </form>
  </div>
  <div id="shortcut-modal" class="modal-backdrop hidden" role="presentation">
    <form id="shortcut-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="shortcut-modal-title">
      <h2 id="shortcut-modal-title">Adicionar atalho</h2>
      <label for="shortcut-url">Link do atalho</label>
      <input id="shortcut-url" type="url" inputmode="url" placeholder="https://exemplo.pt" autocomplete="off" required>
      <p id="shortcut-error" class="modal-error" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="shortcut-cancel" type="button">Cancelar</button>
        <button class="confirm" type="submit">Confirmar</button>
      </div>
    </form>
  </div>

  <script src="app.js?v=6"></script>
</body>
</html>
